<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Ink 交通與天氣面板 (兆康)</title>
  <style>
    /* 專為 E-Ink 顯示器優化的純黑白樣式 */
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      overflow-x: hidden;
    }
    
    .header {
      border: 4px solid #000000;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* 將時間與柴犬放在同一行 */
    .time-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .time {
      font-size: 3.5rem;
      font-weight: bold;
      line-height: 1;
    }
    
    /* 限制柴犬圖片的高度，與時間文字對齊 */
    .shiba-img {
      height: 75px;
      object-fit: contain;
    }
    
    .weather {
      font-size: 1.5rem;
      text-align: right;
      font-weight: bold;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }
    
    .card {
      border: 4px solid #000000;
      padding: 15px;
    }
    
    .card h2 {
      margin-top: 0;
      border-bottom: 4px solid #000000;
      padding-bottom: 10px;
      font-size: 1.8rem;
    }
    
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 1.4rem;
      border-bottom: 2px dashed #000000;
      padding-bottom: 8px;
    }
    
    .row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    
    .route-name {
      font-weight: normal;
    }
    
    .eta {
      font-weight: bold;
    }
    
    .sub-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 10px;
      background-color: #000000;
      color: #ffffff;
      padding: 4px 10px;
      display: inline-block;
    }

    .status-text {
      font-style: italic;
      color: #333;
    }
  </style>
</head>
<body>

<div class="header">
  <!-- 時間與輪播柴犬區塊 -->
  <div class="time-group">
    <div class="time" id="current-time">--:--</div>
    <img id="shiba-gif" class="shiba-img" src="b4394f63557d1599a92711dbfe6aa86d.gif" alt="Shiba Animation">
  </div>
  <div class="weather" id="weather-text">載入天氣中...</div>
</div>

<div class="grid">
  <!-- 輕鐵面板 -->
  <div class="card">
    <h2>輕鐵 (兆康)</h2>
    <div id="lrt-data">
      <div class="row status-text">載入中...</div>
    </div>
  </div>

  <!-- 屯馬綫面板 -->
  <div class="card">
    <h2>屯馬綫 (兆康)</h2>
    <div id="tml-data">
      <div class="row status-text">載入中...</div>
    </div>
  </div>

  <!-- 巴士面板 -->
  <div class="card">
    <h2>巴士 (兆康周邊)</h2>
    <div id="bus-data">
      <div class="row status-text">載入中...</div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 共用工具：計算 ETA 分鐘數
// ==========================================
function getMinutesEta(etaString) {
  if (!etaString) return '-';
  
  if (etaString.includes('分鐘') || etaString.includes('min') || 
      etaString.includes('即將抵達') || etaString.includes('Arriving') || 
      etaString.includes('離開') || etaString.includes('Departing')) {
    return etaString; 
  }
  
  let timeStr = etaString.replace(' ', 'T');
  if (!timeStr.includes('+')) {
    timeStr += '+08:00'; 
  }
  
  const targetTime = new Date(timeStr);
  const now = new Date();
  const diffMs = targetTime - now;
  
  if (diffMs < 0) return '即將抵達';
  
  const diffMins = Math.floor(diffMs / 60000);
  if (diffMins <= 0) return '即將抵達';
  return diffMins + ' 分鐘';
}

// ==========================================
// 1. 本地時間模組 (每秒更新)
// ==========================================
function updateTime() {
  const now = new Date();
  document.getElementById('current-time').innerText = 
    now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
}

// ==========================================
// 2. 柴犬 GIF 輪播模組 (每 15 秒切換)
// ==========================================
const shibaGifs = [
  'b4394f63557d1599a92711dbfe6aa86d.gif', // 伸懶腰
  '41d1bb477f18e8d77357da58d0aed9fe.gif', // 抓癢
  '5b8c4b3492d01532489c4f4e71e17c44.gif'  // 甩毛
];
let shibaIndex = 0;
const shibaImg = document.getElementById('shiba-gif');

function rotateShiba() {
  shibaIndex = (shibaIndex + 1) % shibaGifs.length;
  shibaImg.src = shibaGifs[shibaIndex];
}
setInterval(rotateShiba, 15000); // 15000 毫秒 = 15 秒

// ==========================================
// 3. 天文台天氣模組 (每 15 分鐘更新)
// ==========================================
async function updateWeather() {
  try {
    const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
    const data = await res.json();
    const temp = data.temperature.data[0].value;
    const hum = data.humidity.data[0].value;
    document.getElementById('weather-text').innerHTML = `${temp}°C<br>${hum}% 濕度`;
  } catch(e) {
    console.error('Weather fetch error:', e);
  }
}

// ==========================================
// 4. 港鐵輕鐵模組 (每分鐘更新)
// ==========================================
async function updateLRT() {
  try {
    const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=100');
    const data = await res.json();
    if(data.status !== 1) throw new Error("API status error");
    
    let html = '';
    if(data.platform_list && data.platform_list.length > 0) {
      data.platform_list.forEach(plat => {
        if(plat.route_list && plat.route_list.length > 0) {
          plat.route_list.slice(0, 2).forEach(route => {
             html += `<div class="row">
               <span class="route-name">往 ${route.dest_ch} (${route.route_no})</span>
               <span class="eta">${route.time_ch}</span>
             </div>`;
          });
        }
      });
    }
    
    if(!html) html = '<div class="row status-text">暫無服務</div>';
    document.getElementById('lrt-data').innerHTML = html;
  } catch(e) {
    document.getElementById('lrt-data').innerHTML = '<div class="row status-text">載入失敗</div>';
  }
}

// ==========================================
// 5. 港鐵屯馬綫模組 (每分鐘更新)
// ==========================================
const tmlDestMap = { 'WKS': '烏溪沙', 'TUM': '屯門', 'HUH': '紅磡', 'NAC': '南昌', 'MEF': '美孚' };

async function updateTML() {
  try {
    const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=SIH');
    const json = await res.json();
    if(json.status !== 1) throw new Error("API status error");
    
    let html = '';
    const tmlData = json.data['TML-SIH'];
    
    const processDir = (dirData) => {
       if(!dirData || dirData.length === 0) return;
       dirData.slice(0, 2).forEach(train => {
         const destName = tmlDestMap[train.dest] || train.dest;
         const eta = getMinutesEta(train.time);
         html += `<div class="row">
           <span class="route-name">往 ${destName}</span>
           <span class="eta">${eta}</span>
         </div>`;
       });
    };
    if(tmlData) {
      processDir(tmlData.UP);
      processDir(tmlData.DOWN);
    }
    
    if(!html) html = '<div class="row status-text">暫無服務</div>';
    document.getElementById('tml-data').innerHTML = html;
  } catch(e) {
    document.getElementById('tml-data').innerHTML = '<div class="row status-text">載入失敗</div>';
  }
}

// ==========================================
// 6. 巴士模組 (KMB、城巴)
// ==========================================
async function updateBuses() {
  const busDataContainer = document.getElementById('bus-data');
  let htmlContent = '';

  const renderRoute = (name, etas) => {
    let html = `<div class="sub-title">${name}</div>`;
    let count = 0;
    etas.slice(0, 2).forEach(eta => {
      if (eta) {
        count++;
        const displayStr = (eta.includes('分鐘') || eta.includes('即將') || eta.includes('離開')) 
          ? eta 
          : getMinutesEta(eta);
        html += `<div class="row"><span class="route-name">下班車</span><span class="eta">${displayStr}</span></div>`;
      }
    });
    if (count === 0) {
      html += `<div class="row status-text">暫無班次 / 已收車</div>`;
    }
    return html;
  };

  try {
    const kmbRoutes = [
      { route: '261', seq: 10, dir: 'O', name: '九巴 261 (往 粉嶺)' },
      { route: '62X', seq: 7, dir: 'O', name: '九巴 62X (往 鯉魚門)' },
      { route: '258P', seq: 4, dir: 'O', name: '九巴 258P (往 藍田)' }
    ];
    
    for (const req of kmbRoutes) {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${req.route}/1`);
        const json = await res.json();
        const etas = (json.data || [])
          .filter(x => x.seq === req.seq && x.dir === req.dir && x.eta)
          .map(x => x.eta);
        htmlContent += renderRoute(req.name, etas);
      } catch(e) {}
    }

    const ctbRoutes = ['50', '56', 'B3A'];
    
    for (const route of ctbRoutes) {
      try {
        let etas = [];
        
        const [resOut, resIn] = await Promise.all([
          fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/003207/${route}`).catch(()=>null),
          fetch(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/003209/${route}`).catch(()=>null)
        ]);
        
        if (resOut) {
          const jsonOut = await resOut.json();
          if (jsonOut.data) jsonOut.data.forEach(x => { if(x.eta) etas.push(x) });
        }
        if (resIn) {
          const jsonIn = await resIn.json();
          if (jsonIn.data) jsonIn.data.forEach(x => { if(x.eta) etas.push(x) });
        }
        
        etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
        
        let html = `<div class="sub-title">城巴 ${route}</div>`;
        let count = 0;
        
        etas.slice(0, 3).forEach(x => {
          count++;
          const displayStr = getMinutesEta(x.eta);
          html += `<div class="row"><span class="route-name">往 ${x.dest_tc}</span><span class="eta">${displayStr}</span></div>`;
        });
        
        if (count === 0) {
          html += `<div class="row status-text">暫無班次 / 已收車</div>`;
        }
        htmlContent += html;
        
      } catch(e) {}
    }

    busDataContainer.innerHTML = htmlContent;

  } catch (globalError) {
    busDataContainer.innerHTML = '<div class="row status-text">巴士模組載入失敗</div>';
  }
}

// ==========================================
// 初始化與計時器管理
// ==========================================
updateTime();
setInterval(updateTime, 1000); 

updateWeather();
setInterval(updateWeather, 15 * 60 * 1000); 

function updateTransports() {
  updateLRT();
  updateTML();
  updateBuses();
}
updateTransports();
setInterval(updateTransports, 60 * 1000); 

</script>
</body>
</html>
